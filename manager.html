<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ExportAI Manager</title>
    <link rel="stylesheet" href="src/manager/manager.css" />
  </head>
  <body>
    <main class="manager-shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>ExportAI</h1>
          <p id="planSummary">Đang tải quota...</p>
        </div>
        <nav class="tabs" aria-label="Manager views">
          <button class="active" data-view="dashboard" type="button">Dashboard</button>
          <button data-view="tasks" type="button">Tasks</button>
          <button data-view="archives" type="button">Archives</button>
          <button data-view="diagnostics" type="button">Diagnostics</button>
          <button data-view="repair" type="button">Repair</button>
          <button data-view="adapters" type="button">Adapters</button>
          <button data-view="rules" type="button">Rules</button>
          <button data-view="presets" type="button">Presets</button>
          <button data-view="settings" type="button">Settings</button>
          <button data-view="plan" type="button">Plan</button>
        </nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <h2>Conversation workspace</h2>
            <p>Provider health, tasks, archives, and repair status.</p>
          </div>
          <button id="refreshButton" type="button">Refresh</button>
        </header>

        <section id="taskFilters" class="tabs compact" aria-label="Task filters">
          <button class="active" data-filter="all" type="button">All</button>
          <button data-filter="running" type="button">Running</button>
          <button data-filter="queued" type="button">Queued</button>
          <button data-filter="waiting_for_tab" type="button">Waiting</button>
          <button data-filter="success" type="button">Success</button>
          <button data-filter="failed" type="button">Failed</button>
        </section>

        <section id="taskSearchPanel" class="filter-panel" aria-label="Task search and filters" hidden>
          <label class="filter-field search-field">
            <span>Search</span>
            <input id="taskSearchInput" type="search" placeholder="Title, provider, URL, format, preset, error..." />
          </label>
          <label class="filter-field">
            <span>Provider</span>
            <select id="taskProviderFilter">
              <option value="all">All providers</option>
            </select>
          </label>
          <label class="filter-field">
            <span>Format</span>
            <select id="taskFormatFilter">
              <option value="all">All formats</option>
            </select>
          </label>
          <label class="filter-field">
            <span>Sort</span>
            <select id="taskSortSelect">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="title">Title A-Z</option>
              <option value="provider">Provider A-Z</option>
            </select>
          </label>
        </section>

        <section id="taskList" class="task-list" aria-live="polite"></section>
      </section>
    </main>
    <script src="src/manager/manager.js"></script>
  </body>
</html>
